version: '3.8'
services:

  #
  # A standalone instance of the Curity Identity Server, including the usernamepassword plugin's JAR files
  #
  curity-idsvr:
    image: custom_curity_idsvr:latest
    ports:
     - 6749:6749
     - 8443:8443
    volumes:
     - ./license.json:/opt/idsvr/etc/init/license/license.json
     - ./config-backup.xml:/opt/idsvr/etc/init/config.xml
     - ./example-logo.png:/opt/idsvr/usr/share/webroot/assets/images/example-logo.png
    environment:
      PASSWORD: 'Password1'
      LOGGING_LEVEL: 'INFO'
      RUNTIME_BASE_URL: "${RUNTIME_BASE_URL}"

  #
  # A JDBC data source for storing user accounts and credentials
  #
  curity-data:
    image: postgres:latest
    hostname: dbserver
    volumes:
      - ./data:/var/lib/postgresql/
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'Password1'
      POSTGRES_DB: 'idsvr'

  #
  # A job container to initialize the database schema and import test user accounts
  #
  curity-data-init:
    image: curity.azurecr.io/curity/idsvr:latest
    hostname: dbserverinit
    volumes:
      - ./dbinit/init.sh:/tmp/init.sh
    command: ["/tmp/init.sh"]
    environment:
      JDBC_URL: jdbc:postgresql://dbserver:5432/idsvr
      JDBC_USERNAME: 'postgres'
      JDBC_PASSWORD: 'Password1'
    depends_on:
      curity-data:
        condition: service_started

  #
  # An SMTP server for testing, which provides a mock email inbox for testing at http://localhost:1080
  # 
  #
  smtp-server:
    image: maildev/maildev:latest
    hostname: smtpserver
    environment:
      MAILDEV_INCOMING_USER: 'noreply@example.com'
      MAILDEV_INCOMING_PASSWORD: 'Password1'
    ports:
      - 1080:1080
